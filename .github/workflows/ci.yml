name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/python-quality-uv.yml@main
    with:
      python_version: "3.14"
      working_directory: .

  tests:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/python-tests-uv.yml@main
    with:
      python_version: "3.14"
      working_directory: .
      postgres_enabled: true
      postgres_db: agent_monitoring_test
      postgres_user: agent_monitoring
      postgres_password: agent-monitoring-local-password
      postgres_port: "5432"
      test_environment: |
        DATABASE_HOST=localhost
        DATABASE_PORT=5432
        DATABASE_NAME=agent_monitoring_test
        DATABASE_USER=agent_monitoring
        DATABASE_PASSWORD=agent-monitoring-local-password

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [quality, tests]
    env:
      ENVIRONMENT: prod
      TAG: v0.0.0-ci
      DATABASE_NAME: agent_monitoring
      DATABASE_USER: agent_monitoring
      DATABASE_PASSWORD: agent-monitoring-local-password
      LOG_ANALYSIS_MCP_URL: http://mcp-log-server:8000/mcp
      MCP_WORKFLOW_JWT: ci-token
      EMAIL_HOST: localhost
      EMAIL_FROM: monitoring@example.com
      EMAIL_TO: ops@example.com
      SITEMAP_PUBLIC_HOST: https://example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate local compose config
        run: docker compose config

      - name: Validate production compose config
        run: docker compose -f docker-compose.prod.yml config

      - name: Build Docker image
        run: docker compose build monitoring-app

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: LukaszRemkowicz/ci-cd/.github/workflows/codeql.yml@main
    with:
      languages_json: '["python"]'

  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: LukaszRemkowicz/ci-cd/.github/workflows/trivy-scan.yml@main
    with:
      scan_path: .
      severity: CRITICAL,HIGH
      category: agent-monitoring-filesystem

  version-check:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/pyproject-version-check.yml@main
    with:
      base_branch: main
      head_branch: dev

  pr-status:
    needs: [quality, tests, docker-build, codeql, trivy, version-check]
    if: always()
    permissions:
      issues: write
      pull-requests: write
    uses: LukaszRemkowicz/ci-cd/.github/workflows/pr-status.yml@main
    with:
      status_items_json: >-
        {"Quality":"${{ needs.quality.result }}","Tests":"${{ needs.tests.result }}","Docker Build Check":"${{ needs.docker-build.result }}","CodeQL":"${{ needs.codeql.result }}","Trivy":"${{ needs.trivy.result }}","Version Check":"${{ needs.version-check.result }}"}
      success_message: All agent-monitoring CI checks passed.
      failure_message: Agent-monitoring CI failed. Please review the workflow logs.
